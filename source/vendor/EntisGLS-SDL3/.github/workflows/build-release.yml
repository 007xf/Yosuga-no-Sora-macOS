name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CCACHE_DIR: ${{ github.workspace }}/build/compiler-cache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 1G
  ENTISGLS_COMPILER_CACHE: ccache

defaults:
  run:
    shell: bash

jobs:
  android:
    name: Android ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore persistent Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          for name in ('KEYSTORE_BASE64', 'KEY_ALIAS', 'STORE_PASSWORD'):
              if not os.environ.get(name):
                  raise SystemExit(f'Missing Android signing secret: {name}; see docs/development/github-actions.md')
          key = Path(os.environ['RUNNER_TEMP']) / 'entisgls-signing.keystore'
          with key.open('xb') as output:
              key.chmod(0o600)
              output.write(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          PY
      - name: Locate Android SDK cache
        id: android_sdk
        run: |
          printf 'root=%s\n' "$ANDROID_HOME" >> "$GITHUB_OUTPUT"
          printf 'image=%s\n' "$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Restore Android SDK and NDK packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.android_sdk.outputs.root }}/ndk/27.2.12479018
            ${{ steps.android_sdk.outputs.root }}/platforms/android-35
            ${{ steps.android_sdk.outputs.root }}/build-tools/35.0.0
            ${{ steps.android_sdk.outputs.root }}/platform-tools
          key: android-sdk-v1-${{ runner.os }}-${{ runner.arch }}-api35-bt35.0.0-ndk27.2.12479018-${{ steps.android_sdk.outputs.image }}
          restore-keys: |
            android-sdk-v1-${{ runner.os }}-${{ runner.arch }}-api35-bt35.0.0-ndk27.2.12479018-
      - name: Install host tools and pinned Android packages
        run: |
          sudo apt-get update
          sudo apt-get install -y bison ccache cmake make
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Identify compiler cache toolchain
        id: compiler
        run: |
          python3 - <<'PYTOOLCHAIN'
          import hashlib, json, os, subprocess
          commands = [['ccache', '--version'], [os.path.join(os.environ['ANDROID_NDK_HOME'], 'toolchains/llvm/prebuilt/linux-x86_64/bin/clang'), '--version']]
          identity = {'image': os.environ.get('ImageVersion', ''),
                      'toolchain': [subprocess.check_output(command, text=True).strip() for command in commands]}
          digest = hashlib.sha256(json.dumps(identity, sort_keys=True).encode()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('identity=' + digest + '\n')
          print(json.dumps(identity, indent=2))
          PYTOOLCHAIN
      - name: Restore compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v1-android-arm64-${{ steps.compiler.outputs.identity }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-v1-android-arm64-${{ steps.compiler.outputs.identity }}-
      - name: Reset compiler cache statistics
        run: ccache --zero-stats
      - name: Restore verified dependency downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/downloads
          key: downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/sdk/setup_sdl3.py', 'tools/sdk/setup_sdl_fonts.py', 'tools/ci/ci_prepare_dependencies.py', 'vendor/official-entis-dependencies.json') }}
          restore-keys: |
            downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Verify committed dependencies
        run: python3 tools/ci/ci_prepare_dependencies.py
      - name: Test build tools
        run: python3 -m unittest discover -s tests/unit/python -p 'test_*.py' -v
      - name: Test Android directory access and save recovery
        run: |
          python3 tests/integration/android/test_import_discovery.py
          python3 tests/integration/android/test_psb_settings.py
          python3 tests/integration/android/test_document_tree.py
      - name: Build, sign and verify APK
        env:
          ENTISGLS_ANDROID_KEYSTORE: ${{ runner.temp }}/entisgls-signing.keystore
          ENTISGLS_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ENTISGLS_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ENTISGLS_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 tools/build/build_sdl_android.py --jobs 4 --output artifacts/EntisGLSLauncher-android-arm64.apk
      - name: Verify compiler cache handled compilation
        run: python3 tools/ci/ci_compiler_cache_stats.py --output build/ci/ccache.json --require-compilations
      - name: Report compiler cache statistics
        if: always() && steps.compiler.outcome == 'success'
        run: python3 tools/ci/ci_compiler_cache_stats.py --output build/ci/ccache.json
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/entisgls-signing.keystore"
      - name: Upload Android release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-android-arm64
          if-no-files-found: error
          compression-level: 0
          path: |
            artifacts/EntisGLSLauncher-android-arm64.apk
            artifacts/EntisGLSLauncher-android-arm64.build.json
      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-android
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/android-sdl3/logs/*.log
            build/ci/dependencies.json
            build/ci/ccache*.json

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
            jobs: 3
          - runner: macos-15
            arch: arm64
            jobs: 2
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Restore Homebrew downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            brew-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Install host Bison and ccache
        run: |
          brew install bison ccache
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "TJS_BISON=$(brew --prefix bison)/bin/bison" >> "$GITHUB_ENV"
      - name: Identify compiler cache toolchain
        id: compiler
        run: |
          python3 - <<'PYTOOLCHAIN'
          import hashlib, json, os, subprocess
          commands = [['ccache', '--version'], ['xcodebuild', '-version'], ['xcrun', '--sdk', 'macosx', 'clang', '--version'], ['xcrun', '--sdk', 'macosx', '--show-sdk-version']]
          identity = {'image': os.environ.get('ImageVersion', ''),
                      'toolchain': [subprocess.check_output(command, text=True).strip() for command in commands]}
          digest = hashlib.sha256(json.dumps(identity, sort_keys=True).encode()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('identity=' + digest + '\n')
          print(json.dumps(identity, indent=2))
          PYTOOLCHAIN
      - name: Restore compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v1-macos-${{ matrix.arch }}-${{ steps.compiler.outputs.identity }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-v1-macos-${{ matrix.arch }}-${{ steps.compiler.outputs.identity }}-
      - name: Reset compiler cache statistics
        run: ccache --zero-stats
      - name: Restore verified dependency downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/downloads
          key: downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/sdk/setup_sdl3.py', 'tools/sdk/setup_sdl_fonts.py', 'tools/ci/ci_prepare_dependencies.py', 'vendor/official-entis-dependencies.json') }}
          restore-keys: |
            downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Verify committed dependencies
        run: python3 tools/ci/ci_prepare_dependencies.py
      - name: Test build tools
        run: python3 -m unittest discover -s tests/unit/python -p 'test_*.py' -v
      - name: Build and verify app archive
        run: python3 tools/build/build_sdl_desktop.py --arch '${{ matrix.arch }}' --jobs '${{ matrix.jobs }}'
      - name: Run native tests and launcher smoke test
        run: |
          python3 tools/ci/ci_native_checks.py --build-dir 'build/macos-sdl3-${{ matrix.arch }}' --jobs '${{ matrix.jobs }}' --report 'artifacts/release/EntisGLSLauncher-macos-${{ matrix.arch }}.tests.json'
      - name: Compile optional runtime diagnostics
        if: matrix.arch == 'arm64'
        run: |
          cmake -S . -B 'build/macos-sdl3-${{ matrix.arch }}' -DENTISGLS_BUILD_DIAGNOSTICS=ON
          cmake --build 'build/macos-sdl3-${{ matrix.arch }}' --target studysteady_sdl --parallel '${{ matrix.jobs }}'
      - name: Verify compiler cache handled compilation
        run: python3 tools/ci/ci_compiler_cache_stats.py --output build/ci/ccache.json --require-compilations
      - name: Report compiler cache statistics
        if: always() && steps.compiler.outcome == 'success'
        run: python3 tools/ci/ci_compiler_cache_stats.py --output build/ci/ccache.json
      - name: Collect release files
        run: |
          cp 'artifacts/entisgls-launcher/macos-${{ matrix.arch }}/EntisGLSLauncher.zip' 'artifacts/release/EntisGLSLauncher-macos-${{ matrix.arch }}.zip'
          cp 'artifacts/entisgls-launcher/macos-${{ matrix.arch }}/build.json' 'artifacts/release/EntisGLSLauncher-macos-${{ matrix.arch }}.build.json'
      - name: Upload macOS release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos-${{ matrix.arch }}
          if-no-files-found: error
          compression-level: 0
          path: artifacts/release/*
      - name: Upload macOS diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-macos-${{ matrix.arch }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/ci/dependencies.json
            build/ci/ccache*.json
            artifacts/release/*.tests.json

  ios:
    name: Unsigned iOS ARM64
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Restore Homebrew downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            brew-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Prepare host tools
        run: |
          brew install bison ccache
          echo "TJS_BISON=$(brew --prefix bison)/bin/bison" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Identify compiler cache toolchain
        id: compiler
        run: |
          python3 - <<'PYTOOLCHAIN'
          import hashlib, json, os, subprocess
          commands = [['ccache', '--version'], ['xcodebuild', '-version'], ['xcrun', '--sdk', 'iphoneos', 'clang', '--version'], ['xcrun', '--sdk', 'iphoneos', '--show-sdk-version']]
          identity = {'image': os.environ.get('ImageVersion', ''),
                      'toolchain': [subprocess.check_output(command, text=True).strip() for command in commands]}
          digest = hashlib.sha256(json.dumps(identity, sort_keys=True).encode()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('identity=' + digest + '\n')
          print(json.dumps(identity, indent=2))
          PYTOOLCHAIN
      - name: Restore compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v1-ios-arm64-${{ steps.compiler.outputs.identity }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-v1-ios-arm64-${{ steps.compiler.outputs.identity }}-
      - name: Reset compiler cache statistics
        run: ccache --zero-stats
      - name: Restore verified dependency downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/downloads
          key: downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/sdk/setup_sdl3.py', 'tools/sdk/setup_sdl_fonts.py', 'tools/ci/ci_prepare_dependencies.py', 'vendor/official-entis-dependencies.json') }}
          restore-keys: |
            downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Verify dependencies and build tools
        run: |
          python3 tools/ci/ci_prepare_dependencies.py
          python3 -m unittest discover -s tests/unit/python -p 'test_*.py' -v
      - name: Build unsigned device app and IPA
        run: |
          python3 tools/build/build_sdl_ios.py --sdk iphoneos --jobs 3 2>&1 | tee build/ci/ios-device.log
      - name: Verify compiler cache handled compilation
        run: python3 tools/ci/ci_compiler_cache_stats.py --output build/ci/ccache.json --require-compilations
      - name: Report compiler cache statistics
        if: always() && steps.compiler.outcome == 'success'
        run: python3 tools/ci/ci_compiler_cache_stats.py --output build/ci/ccache.json
      - name: Collect release files
        run: |
          mkdir -p artifacts/release
          cp artifacts/entisgls-launcher/ios-arm64/EntisGLSLauncher-unsigned.ipa artifacts/release/EntisGLSLauncher-ios-arm64-unsigned.ipa
          cp artifacts/entisgls-launcher/ios-arm64/build.json artifacts/release/EntisGLSLauncher-ios-arm64-unsigned.build.json
      - name: Upload unsigned iOS release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-ios-arm64
          if-no-files-found: error
          compression-level: 0
          path: artifacts/release/*
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-ios-arm64
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/ci/ios-device.log
            build/ios-arm64/logs/*.log
            build/ci/dependencies.json
            build/ci/ccache*.json
            artifacts/entisgls-launcher/ios-arm64/build.json

  release:
    name: Publish GitHub Release
    needs: [android, macos, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/_bootstrap.py
            tools/ci/ci_release.py
            tools/ci/ci_ios_release.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-files
      - name: Verify assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/ci_release.py --artifacts release-files
